services:
  # 1. Python FastAPI Backend
  - type: web
    name: hotk-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: house_of_the_knight
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@houseoftheknight.com
      - key: ADMIN_PASSWORD
        value: KnightAdmin#2026
      - key: CORS_ORIGINS
        value: "*"

  # 2. React Frontend (Static Site)
  - type: static_site
    name: hotk-frontend
    rootDir: frontend
    buildCommand: npm install && CI=false npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        sync: false
